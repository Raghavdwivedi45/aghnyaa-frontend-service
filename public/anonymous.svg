<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Decorative Glow -->
  <circle cx="160" cy="120" r="90" fill="#4F46E5" opacity=".25" filter="url(#blur)"/>
  <circle cx="760" cy="480" r="120" fill="#06B6D4" opacity=".2" filter="url(#blur)"/>

  <!-- Dots -->
  <g opacity=".08" fill="#fff">
    <circle cx="70" cy="80" r="2"/>
    <circle cx="120" cy="200" r="2"/>
    <circle cx="210" cy="120" r="2"/>
    <circle cx="760" cy="90" r="2"/>
    <circle cx="820" cy="170" r="2"/>
    <circle cx="720" cy="250" r="2"/>
    <circle cx="150" cy="500" r="2"/>
    <circle cx="320" cy="540" r="2"/>
    <circle cx="640" cy="520" r="2"/>
    <circle cx="810" cy="420" r="2"/>
  </g>

  <!-- Illustration -->
  <g transform="translate(230 95)" filter="url(#shadow)">
    <!-- Browser -->
    <rect x="0" y="0" rx="24" width="440" height="290"
          fill="#111827" stroke="#334155" stroke-width="2"/>

    <!-- Browser Header -->
    <rect x="0" y="0" width="440" height="46" rx="24"
          fill="#1F2937"/>
    <circle cx="28" cy="23" r="6" fill="#EF4444"/>
    <circle cx="48" cy="23" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="23" r="6" fill="#10B981"/>

    <!-- Magnifier -->
    <circle cx="220" cy="145" r="58"
            stroke="url(#accent)"
            stroke-width="12"/>
    <line x1="260" y1="185" x2="305" y2="230"
          stroke="url(#accent)"
          stroke-width="12"
          stroke-linecap="round"/>

    <!-- Question -->
    <text x="220"
          y="165"
          text-anchor="middle"
          font-size="64"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-weight="700"
          fill="#E2E8F0">?</text>

    <!-- Decorative Lines -->
    <rect x="90" y="225" width="260" height="10" rx="5" fill="#334155"/>
    <rect x="120" y="250" width="200" height="10" rx="5" fill="#334155"/>
  </g>

  <!-- 404 -->
  <text x="450"
        y="445"
        text-anchor="middle"
        font-size="84"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-weight="800"
        fill="#F8FAFC">
    404
  </text>

  <!-- Message -->
  <text x="450"
        y="492"
        text-anchor="middle"
        font-size="26"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        fill="#CBD5E1">
    Oops! The page you're looking for doesn't exist.
  </text>

  <text x="450"
        y="530"
        text-anchor="middle"
        font-size="18"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        fill="#94A3B8">
    It may have been moved, deleted, or never existed.
  </text>
</svg>
